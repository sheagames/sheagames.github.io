<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SheaGames — Loading</title>
<link rel="icon" type="image/png" href="SPIRE.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}body{background-image:none!important}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;opacity:0;transition:opacity .6s;z-index:1}#game.show{opacity:1}
#loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;transition:opacity .65s,transform .65s cubic-bezier(.22,.8,.22,1)}#loader.hide{opacity:0;pointer-events:none;transform:scale(1.01)}
.logo{display:none}.title{color:#fff;font-size:clamp(23px,5vw,32px);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:25px;text-shadow:none}.barbox{width:310px;max-width:76vw;height:16px;margin-bottom:16px;overflow:hidden;border:1px solid #fff;border-radius:4px;background:#000;box-shadow:0 0 0 1px #fff,0 0 12px #fff}.bar{width:0;height:100%;background:#000;border-right:1px solid #fff;border-radius:0;transition:width .3s;box-shadow:0 0 10px #fff}.percent{color:#fff;font-size:15px;font-weight:700}.dots{display:flex;gap:8px;margin-top:24px}.dot{width:8px;height:8px;border:1px solid #fff;border-radius:0;background:#000;box-shadow:0 0 8px #fff;animation:dot 1.25s infinite}.dot:nth-child(2),.dot:nth-child(3){background:#000}.dot:nth-child(2){animation-delay:-.18s}.dot:nth-child(3){animation-delay:-.36s}
#error{display:none;position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;background:#000}#error.show{display:flex}#error p{margin-bottom:20px;padding:16px 18px;color:#fff;background:#000;border:1px solid #fff;border-radius:4px;box-shadow:0 0 0 1px #fff,0 0 14px #fff}#error a{padding:10px 16px;color:#fff;background:#000;border:1px solid #fff;border-radius:4px;text-decoration:none;box-shadow:0 0 0 1px #fff,0 0 12px #fff}#error a:hover{background:#000;color:#fff;box-shadow:0 0 0 2px #fff,0 0 18px #fff}
@keyframes dot{0%,80%,100%{opacity:.35;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<iframe id="game"></iframe>

<div id="loader">

<div class="title">SheaGames</div>
<div class="barbox"><div class="bar" id="bar"></div></div>
<div class="percent" id="percent">0%</div>
<div class="dots">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>
</div>

<div id="error">
<p id="errorText">Game could not be loaded.</p>
<a href="index.html">Go Back</a>
</div>

<script>
const params=new URLSearchParams(location.search);
let id=params.get("game")||"1";

if(!/^[0-9]+$/.test(id))id="1";

const frame=document.getElementById("game");
const loader=document.getElementById("loader");
const bar=document.getElementById("bar");
const percent=document.getElementById("percent");
const error=document.getElementById("error");
const errorText=document.getElementById("errorText");

let progress=0;
let loaded=false;

const gameURL=new URL(id+".html",location.href).href;

const timer=setInterval(function(){
if(progress<90){
progress+=Math.random()*10;
if(progress>90)progress=90;
bar.style.width=progress+"%";
percent.textContent=Math.floor(progress)+"%";
}
},250);

frame.src=gameURL;

frame.onload=function(){
if(loaded)return;
loaded=true;

clearInterval(timer);

bar.style.width="100%";
percent.textContent="100%";

setTimeout(function(){
frame.classList.add("show");

setTimeout(function(){
loader.classList.add("hide");

setTimeout(function(){
loader.style.display="none";
},800);

},150);

},400);
};

frame.onerror=function(){
clearInterval(timer);
errorText.textContent="Game "+id+".html could not be loaded.";
error.classList.add("show");
loader.style.display="none";
};
</script>

</body>
</html>
