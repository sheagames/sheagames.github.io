<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIRE</title>
<link rel="icon" type="image/png" href="./SPIRE.png">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    overflow: hidden;
}

#gameContainer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: auto;
    z-index: 1;
}

#gameContainer iframe,
#gameContainer object,
#gameContainer embed {
    width: 100%;
    height: 100%;
}

#loader {
    position: fixed;
    inset: 0;
    z-index: 999999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    visibility: visible;
    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}

#loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loaderContent {
    width: min(500px, 85vw);
    text-align: center;
}

.logo {
    width: 164px;
    height: 164px;
    object-fit: contain;
    display: block;
    margin: 0 auto 30px;
}

.loaderTitle {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 5px;
    margin-bottom: 26px;
}

.progressOuter {
    width: 100%;
    height: 8px;
    border: 2px solid #fff;
    background: #000;
    overflow: hidden;
}

.progressInner {
    width: 0%;
    height: 100%;
    background: #fff;
}

.percent {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 14px;
}

.dots {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    height: 20px;
    margin-top: 7px;
    letter-spacing: 3px;
}

#fallback {
    position: fixed;
    inset: 0;
    z-index: 1000000;
    background: #000;
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
}

#fallbackBox {
    width: min(500px, 85vw);
    border: 2px solid #fff;
    padding: 30px;
}

#fallback button {
    margin-top: 20px;
    padding: 12px 24px;
    border: 0;
    background: #fff;
    color: #000;
    font-weight: 700;
    cursor: pointer;
}
</style>

</head>

<body>

<div id="gameContainer"></div>

<div id="loader">
    <div class="loaderContent">

```
    <img
        src="./logo.png"
        width="164"
        height="164"
        class="logo"
        alt="SheaGames">

    <div class="loaderTitle">SHEAGAMES</div>

    <div class="progressOuter">
        <div id="progress" class="progressInner"></div>
    </div>

    <div id="percent" class="percent">0%</div>

    <div id="dots" class="dots">.</div>

</div>
```

</div>

<div id="fallback">
    <div id="fallbackBox">
        <div>GAME COULD NOT BE OPENED</div>
        <button onclick="location.reload()">RETRY</button>
    </div>
</div>

<script>
(function () {

    const params = new URLSearchParams(window.location.search);

    let gameId = params.get("game");

    if (!gameId || !/^\d+$/.test(gameId)) {
        gameId = "1";
    }

    gameId = String(parseInt(gameId, 10));

    const gameContainer =
        document.getElementById("gameContainer");

    const loader =
        document.getElementById("loader");

    const progress =
        document.getElementById("progress");

    const percent =
        document.getElementById("percent");

    const dots =
        document.getElementById("dots");

    const fallback =
        document.getElementById("fallback");

    const startTime = performance.now();

    const minimumTime = 15000;
    const maximumTime = 25000;

    const targetTime =
        minimumTime +
        Math.random() *
        (maximumTime - minimumTime);

    let finished = false;

    function loadGame() {

        const frame = document.createElement("iframe");

        frame.src = "./" + gameId + ".html";

        frame.setAttribute(
            "allow",
            "autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
        );

        frame.setAttribute(
            "allowfullscreen",
            ""
        );

        frame.setAttribute(
            "frameborder",
            "0"
        );

        frame.setAttribute(
            "scrolling",
            "no"
        );

        frame.style.position = "absolute";
        frame.style.left = "0";
        frame.style.top = "0";
        frame.style.width = "100%";
        frame.style.height = "100%";
        frame.style.border = "0";
        frame.style.margin = "0";
        frame.style.padding = "0";
        frame.style.background = "#000";

        gameContainer.appendChild(frame);
    }

    function updateLoader() {

        if (finished) {
            return;
        }

        const elapsed =
            performance.now() - startTime;

        const raw =
            Math.min(elapsed / targetTime, 1);

        let value;

        if (raw < 0.12) {
            value = raw / 0.12 * 5;
        } else if (raw < 0.35) {
            const t = (raw - 0.12) / 0.23;
            value = 5 + t * 18;
        } else if (raw < 0.62) {
            const t = (raw - 0.35) / 0.27;
            value = 23 + t * 29;
        } else if (raw < 0.84) {
            const t = (raw - 0.62) / 0.22;
            value = 52 + t * 30;
        } else if (raw < 0.96) {
            const t = (raw - 0.84) / 0.12;
            value = 82 + t * 14;
        } else {
            const t = (raw - 0.96) / 0.04;
            value = 96 + t * 4;
        }

        value = Math.min(99, value);

        progress.style.width = value + "%";
        percent.textContent =
            Math.floor(value) + "%";

        if (raw >= 1) {
            finishLoader();
            return;
        }

        requestAnimationFrame(updateLoader);
    }

    function finishLoader() {

        if (finished) {
            return;
        }

        finished = true;

        progress.style.width = "100%";
        percent.textContent = "100%";
        dots.textContent = "...";

        setTimeout(function () {

            loader.classList.add("hidden");

            setTimeout(function () {
                loader.style.display = "none";
            }, 700);

        }, 350);
    }

    let dotCount = 1;

    setInterval(function () {

        if (finished) {
            return;
        }

        dotCount++;

        if (dotCount > 3) {
            dotCount = 1;
        }

        dots.textContent =
            ".".repeat(dotCount);

    }, 400);

    loadGame();
    requestAnimationFrame(updateLoader);

})();
</script>

</body>
</html>
