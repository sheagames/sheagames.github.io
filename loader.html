<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPIRE</title>
<link rel="icon" type="image/png" href="SPIRE.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:Arial,Helvetica,sans-serif
}

body{background-image:none!important}

#game{
position:fixed;
inset:0;
width:100%;
height:100%;
border:0;
background:#000;
opacity:0;
transition:opacity .6s ease;
z-index:1
}

#game.show{opacity:1}

#loader{
position:fixed;
inset:0;
z-index:9999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
transition:opacity .6s ease,transform .6s ease
}

#loader.hide{
opacity:0;
pointer-events:none;
transform:translateY(-8px)
}

.title{
color:#fff;
font-size:clamp(26px,5vw,36px);
font-weight:800;
letter-spacing:1px;
margin-bottom:25px
}

.barbox{
width:310px;
max-width:76vw;
height:14px;
overflow:hidden;
border:1px solid #fff;
background:#000
}

.bar{
width:0;
height:100%;
background:#fff;
transition:width .25s ease
}

.percent{
margin-top:13px;
color:#fff;
font-size:14px;
font-weight:700
}

#error{
display:none;
position:fixed;
inset:0;
z-index:10000;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
color:#fff;
background:#000
}

#error.show{display:flex}

#error p{
margin-bottom:20px;
padding:16px 18px;
color:#fff;
background:#000;
border:1px solid #fff
}

#error a{
padding:10px 16px;
color:#fff;
background:#000;
border:1px solid #fff;
text-decoration:none
}

#error a:hover

@media(prefers-reduced-motion:reduce){
*,*:before,*:after{
animation-duration:.001ms!important;
transition-duration:.001ms!important
}
} </style>

</head>
<body>

<iframe id="game"></iframe>

<div id="loader">
<div class="title">SPIRE</div>
<div class="barbox">
<div class="bar" id="bar"></div>
</div>
<div class="percent" id="percent">0%</div>
</div>

<div id="error">
<p id="errorText">Game could not be loaded.</p>
<a href="index.html">Go Back</a>
</div>

<script>
const params=new URLSearchParams(location.search);
let id=params.get("game")||"1";

if(!/^[0-9]+$/.test(id))id="1";

const frame=document.getElementById("game");
const loader=document.getElementById("loader");
const bar=document.getElementById("bar");
const percent=document.getElementById("percent");
const error=document.getElementById("error");
const errorText=document.getElementById("errorText");

let progress=0;
let loaded=false;

const gameURL=new URL(id+".html",location.href).href;

const timer=setInterval(function(){
if(progress<90){
progress+=Math.random()*7+1;

if(progress>90)progress=90;

bar.style.width=progress+"%";
percent.textContent=Math.floor(progress)+"%";
}
},250);

frame.src=gameURL;

frame.onload=function(){
if(loaded)return;

loaded=true;
clearInterval(timer);

bar.style.width="100%";
percent.textContent="100%";

setTimeout(function(){
frame.classList.add("show");

setTimeout(function(){
loader.classList.add("hide");

setTimeout(function(){
loader.style.display="none";
},700);

},150);

},350);
};

frame.onerror=function(){
clearInterval(timer);
errorText.textContent="Game "+id+".html could not be loaded.";
error.classList.add("show");
loader.style.display="none";
};
</script>

</body>
</html>
