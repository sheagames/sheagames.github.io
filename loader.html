<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIRE</title>
<link rel="icon" type="image/png" href="./SPIRE.png">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
}

#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: 0;
    margin: 0;
    padding: 0;
    display: block;
    background: #000;
    opacity: 1;
    visibility: visible;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
}

#loader {
    position: fixed;
    inset: 0;
    z-index: 999999;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.65s ease;
}

#loader.hide {
    opacity: 0;
    pointer-events: none;
}

.loaderContent {
    width: min(500px, 85vw);
    text-align: center;
}

.logo {
    width: 164px;
    height: 164px;
    object-fit: contain;
    display: block;
    margin: 0 auto 30px;
}

.title {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 5px;
    margin-bottom: 26px;
}

.progressOuter {
    width: 100%;
    height: 8px;
    border: 2px solid #fff;
    background: #000;
    overflow: hidden;
}

.progressInner {
    width: 0;
    height: 100%;
    background: #fff;
    transform: translate3d(0, 0, 0);
}

.percent {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 14px;
}

.dots {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    height: 20px;
    margin-top: 7px;
}

#recovery {
    position: fixed;
    inset: 0;
    z-index: 999998;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
}

#recovery.show {
    display: flex;
}

.recoveryBox {
    width: min(500px, 85vw);
    text-align: center;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.recoveryTitle {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.recoveryText {
    font-size: 13px;
    opacity: 0.65;
    line-height: 1.6;
}
</style>

</head>

<body>

<iframe
    id="game"
    title="Game"
    frameborder="0"
    scrolling="no"
    allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
    allowfullscreen>
</iframe>

<div id="loader">
    <div class="loaderContent">

```
    <img
        src="./logo.png"
        class="logo"
        width="164"
        height="164"
        alt="SheaGames">

    <div class="title">SHEAGAMES</div>

    <div class="progressOuter">
        <div id="progress" class="progressInner"></div>
    </div>

    <div id="percent" class="percent">0%</div>

    <div id="dots" class="dots">.</div>

</div>
```

</div>

<div id="recovery">
    <div class="recoveryBox">
        <div class="recoveryTitle">STARTING GAME</div>
        <div class="recoveryText">
            Reinitializing the game renderer...
        </div>
    </div>
</div>

<script>
(function () {

    const game = document.getElementById("game");
    const loader = document.getElementById("loader");
    const recovery = document.getElementById("recovery");
    const progress = document.getElementById("progress");
    const percent = document.getElementById("percent");
    const dots = document.getElementById("dots");

    const params = new URLSearchParams(window.location.search);

    let gameId = params.get("game");

    if (!gameId || !/^\d+$/.test(gameId)) {
        gameId = "1";
    }

    gameId = String(parseInt(gameId, 10));

    const gameURL =
        "./" +
        gameId +
        ".html?sheagames=" +
        Date.now();

    let startTime = performance.now();

    const minimumTime = 15000;
    const maximumTime = 25000;

    const targetTime =
        minimumTime +
        Math.random() *
        (maximumTime - minimumTime);

    let complete = false;
    let recoveryStarted = false;
    let reloadCount = 0;

    function loadGame() {

        game.src = "about:blank";

        setTimeout(function () {

            game.src = gameURL;

        }, 80);
    }

    function updateProgress() {

        if (complete) {
            return;
        }

        const elapsed =
            performance.now() - startTime;

        const ratio =
            Math.min(elapsed / targetTime, 1);

        let value;

        if (ratio < 0.10) {

            value =
                ratio / 0.10 * 4;

        } else if (ratio < 0.30) {

            const t =
                (ratio - 0.10) / 0.20;

            value =
                4 + t * 13;

        } else if (ratio < 0.55) {

            const t =
                (ratio - 0.30) / 0.25;

            value =
                17 + t * 25;

        } else if (ratio < 0.78) {

            const t =
                (ratio - 0.55) / 0.23;

            value =
                42 + t * 28;

        } else if (ratio < 0.93) {

            const t =
                (ratio - 0.78) / 0.15;

            value =
                70 + t * 22;

        } else {

            const t =
                (ratio - 0.93) / 0.07;

            value =
                92 + t * 8;
        }

        value =
            Math.max(0, Math.min(99, value));

        progress.style.width =
            value + "%";

        percent.textContent =
            Math.floor(value) + "%";

        if (ratio >= 1) {

            finish();

            return;
        }

        requestAnimationFrame(updateProgress);
    }

    function finish() {

        if (complete) {
            return;
        }

        complete = true;

        progress.style.width = "100%";
        percent.textContent = "100%";
        dots.textContent = "...";

        setTimeout(function () {

            loader.classList.add("hide");

            setTimeout(function () {

                loader.style.display = "none";

                forceRendererRecovery();

            }, 700);

        }, 300);
    }

    function forceRendererRecovery() {

        if (recoveryStarted) {
            return;
        }

        recoveryStarted = true;

        setTimeout(function () {

            try {

                const doc =
                    game.contentDocument ||
                    game.contentWindow.document;

                if (!doc) {
                    return;
                }

                const canvas =
                    doc.querySelector("canvas");

                const ruffle =
                    doc.querySelector("ruffle-player");

                if (canvas || ruffle) {

                    game.style.display = "block";

                    game.style.opacity = "0.999";

                    game.offsetHeight;

                    game.style.opacity = "1";

                    return;
                }

            } catch (e) {
            }

        }, 400);
    }

    game.addEventListener("load", function () {

        game.style.display = "block";
        game.style.visibility = "visible";
        game.style.opacity = "1";
        game.style.transform =
            "translate3d(0,0,0)";

        if (reloadCount === 0) {

            setTimeout(function () {

                try {

                    const doc =
                        game.contentDocument;

                    if (!doc) {
                        return;
                    }

                    const canvas =
                        doc.querySelector("canvas");

                    const ruffle =
                        doc.querySelector("ruffle-player");

                    if (!canvas && !ruffle) {
                        return;
                    }

                } catch (e) {
                }

            }, 2500);
        }

    });

    let dot = 0;

    setInterval(function () {

        if (complete) {
            return;
        }

        dot++;

        if (dot > 3) {
            dot = 1;
        }

        dots.textContent =
            ".".repeat(dot);

    }, 400);

    loadGame();
    requestAnimationFrame(updateProgress);

})();
</script>

</body>
</html>
