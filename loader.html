<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIRE</title>
<link rel="icon" type="image/png" href="./SPIRE.png">
<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:Arial,Helvetica,sans-serif
}

body{
background:#000!important
}

#game{
position:fixed;
inset:0;
width:100%;
height:100%;
border:0;
background:#000;
opacity:0;
visibility:hidden;
z-index:1;
transition:opacity .7s ease,visibility 0s linear .7s
}

#game.ready{
opacity:1;
visibility:visible;
transition:opacity .7s ease
}

#loader{
position:fixed;
inset:0;
z-index:9999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
opacity:1;
visibility:visible;
transition:opacity .7s ease,visibility 0s linear .7s
}

#loader.hide{
opacity:0;
visibility:hidden;
pointer-events:none;
transition:opacity .7s ease,visibility 0s linear .7s
}

.logo{
display:block;
width:164px;
height:164px;
object-fit:contain;
margin-bottom:22px
}

.title{
color:#fff;
font-size:clamp(25px,5vw,36px);
font-weight:800;
letter-spacing:1px;
margin-bottom:24px
}

.barbox{
width:310px;
max-width:76vw;
height:14px;
border:1px solid #fff;
background:#000;
overflow:hidden
}

.bar{
width:0%;
height:100%;
background:#fff;
transform-origin:left center;
transition:width .18s linear
}

.percent{
margin-top:13px;
min-width:45px;
color:#fff;
font-size:14px;
font-weight:700;
text-align:center
}

.status{
margin-top:9px;
color:#aaa;
font-size:12px;
text-align:center;
min-height:15px
}

#error{
display:none;
position:fixed;
inset:0;
z-index:10000;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
background:#000;
color:#fff;
padding:24px
}

#error.show{
display:flex
}

#error p{
max-width:420px;
margin-bottom:20px;
padding:16px 18px;
border:1px solid #fff;
background:#000;
color:#fff;
line-height:1.5
}

#error a{
display:inline-flex;
align-items:center;
justify-content:center;
padding:10px 18px;
border:1px solid #fff;
background:#000;
color:#fff;
text-decoration:none;
transition:background .18s ease,color .18s ease
}

#error a:hover

@media(max-width:500px){

.logo{
width:130px;
height:130px
}

.title{
font-size:27px
}

.barbox{
width:260px
}
}

@media(prefers-reduced-motion:reduce){

*,
*:before,
*:after{
animation-duration:.001ms!important;
transition-duration:.001ms!important
}

} </style>

</head>

<body>

<iframe
id="game"
title="SheaGames Game"
allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
allowfullscreen>
</iframe>

<div id="loader">

<img
class="logo"
src="./logo.png"
alt="SheaGames">

<div class="title">SheaGames</div>

<div class="barbox">
<div class="bar" id="bar"></div>
</div>

<div class="percent" id="percent">0%</div>

<div class="status" id="status">Loading game...</div>

</div>

<div id="error">

<p id="errorText">Game could not be loaded.</p>

<a href="./index.html">Go Back</a>

</div>

<script>
(function(){

"use strict";

const params=new URLSearchParams(window.location.search);

let gameId=params.get("game");

if(!gameId||!/^[0-9]+$/.test(gameId)){
gameId="1";
}

const game=document.getElementById("game");
const loader=document.getElementById("loader");
const bar=document.getElementById("bar");
const percent=document.getElementById("percent");
const status=document.getElementById("status");
const error=document.getElementById("error");
const errorText=document.getElementById("errorText");

const gameURL="./"+gameId+".html";

let documentLoaded=false;
let gameReady=false;
let finished=false;
let progress=0;

const startTime=Date.now();

const MIN_TIME=15000;
const MAX_TIME=25000;

const targetDuration=
MIN_TIME+
Math.random()*(MAX_TIME-MIN_TIME);

function setProgress(value){

progress=Math.max(0,Math.min(100,value));

bar.style.width=progress+"%";
percent.textContent=Math.floor(progress)+"%";

}

function setStatus(text){

status.textContent=text;

}

function showError(message){

if(finished)return;

finished=true;

errorText.textContent=message;

loader.style.display="none";

game.style.display="none";

error.classList.add("show");

}

function calculateProgress(){

const elapsed=Date.now()-startTime;

const timeRatio=Math.min(1,elapsed/targetDuration);

let curve;

if(timeRatio<.12){

curve=timeRatio*1.8;

}else if(timeRatio<.35){

curve=.216+
(timeRatio-.12)*1.55;

}else if(timeRatio<.65){

curve=.5725+
(timeRatio-.35)*.92;

}else if(timeRatio<.88){

curve=.8485+
(timeRatio-.65)*.48;

}else{

curve=.9589+
(timeRatio-.88)*.30;

}

curve=Math.min(.99,curve);

const randomMovement=(Math.random()-.45)*.7;

const target=curve*100+randomMovement;

if(target>progress){

const difference=target-progress;

progress+=Math.max(.08,difference*.075);

if(progress>99){
progress=99;
}

setProgress(progress);

}

}

const progressTimer=setInterval(function(){

if(finished){

clearInterval(progressTimer);

return;
}

calculateProgress();

},120);

function finish(){

if(finished)return;

const elapsed=Date.now()-startTime;

const remaining=Math.max(0,targetDuration-elapsed);

setStatus("Starting game...");

setTimeout(function(){

if(finished)return;

setProgress(100);

setStatus("Ready");

setTimeout(function(){

if(finished)return;

game.classList.add("ready");

setTimeout(function(){

loader.classList.add("hide");

setTimeout(function(){

loader.style.display="none";

},750);

},250);

},350);

},remaining);

}

function checkGameDocument(){

if(finished)return;

try{

const frameDocument=
game.contentDocument||
(game.contentWindow&&game.contentWindow.document);

if(!frameDocument){

return;
}

const body=frameDocument.body;

if(!body){

return;
}

documentLoaded=true;

const ruffle=
frameDocument.querySelector("ruffle-player")||
frameDocument.querySelector("ruffle-player, #flash-container");

if(ruffle){

gameReady=true;

setStatus("Starting game...");

}else{

setStatus("Preparing game...");
}

}catch(e){

documentLoaded=true;

setStatus("Starting game...");

}

}

game.addEventListener("load",function(){

documentLoaded=true;

setStatus("Preparing game...");

checkGameDocument();

setTimeout(function(){

if(!finished){

gameReady=true;

setStatus("Starting game...");

}

},1200);

});

game.addEventListener("error",function(){

showError(
"Game "+gameId+".html could not be loaded."
);

});

game.src=gameURL;

const monitor=setInterval(function(){

if(finished){

clearInterval(monitor);

return;
}

checkGameDocument();

if(documentLoaded){

if(gameReady){

const elapsed=Date.now()-startTime;

if(elapsed>=targetDuration){

clearInterval(monitor);

finish();

}

}else{

const elapsed=Date.now()-startTime;

if(elapsed>=targetDuration){

gameReady=true;

clearInterval(monitor);

finish();

}

}

}

},250);

setTimeout(function(){

if(!finished&&!documentLoaded){

showError(
"Game "+gameId+".html could not be found or loaded."
);

}

},12000);

window.addEventListener("message",function(event){

if(finished)return;

if(!event.data)return;

if(typeof event.data!=="object")return;

if(
event.data.type==="game-loaded"||
event.data.type==="game-ready"||
event.data.type==="ruffle-ready"
){

gameReady=true;

setStatus("Starting game...");

}

});

})();
</script>

</body>
</html>
