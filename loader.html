<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIRE</title>
<link rel="icon" type="image/png" href="./SPIRE.png">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    background: #000;
    display: block;
}

#tung-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
}

#tung-loader.fade {
    opacity: 0;
    pointer-events: none;
}

.loader-content {
    width: min(500px, 85vw);
    text-align: center;
}

.loader-logo {
    width: 164px;
    height: 164px;
    object-fit: contain;
    display: block;
    margin: 0 auto 28px;
}

.loader-title {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 5px;
    margin-bottom: 26px;
}

.progress-container {
    width: 100%;
    height: 8px;
    border: 2px solid #fff;
    background: #000;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #fff;
    transition: width 0.12s linear;
}

.progress-text {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 14px;
}

.loading-dots {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    height: 20px;
    margin-top: 7px;
    letter-spacing: 3px;
}
</style>

</head>

<body>

<iframe
    id="game"
    allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
    allowfullscreen
    frameborder="0"
    scrolling="no">
</iframe>

<div id="tung-loader">
    <div class="loader-content">

```
    <img
        src="./logo.png"
        class="loader-logo"
        width="164"
        height="164"
        alt="SheaGames">

    <div class="loader-title">SHEAGAMES</div>

    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="progressText" class="progress-text">0%</div>

    <div id="loadingDots" class="loading-dots">.</div>

</div>
```

</div>

<script>
const params = new URLSearchParams(window.location.search);

let gameId = params.get("game");

if (!gameId || !/^\d+$/.test(gameId)) {
    gameId = "1";
}

gameId = String(parseInt(gameId, 10));

const game = document.getElementById("game");
const loader = document.getElementById("tung-loader");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const loadingDots = document.getElementById("loadingDots");

let startTime = Date.now();
let finished = false;

const minimumTime = 15000;
const maximumTime = 25000;

const targetTime =
    minimumTime +
    Math.random() * (maximumTime - minimumTime);

game.src = "./" + gameId + ".html";

function animateLoader() {

    if (finished) {
        return;
    }

    const elapsed = Date.now() - startTime;
    const raw = Math.min(elapsed / targetTime, 1);

    let progress;

    if (raw < 0.15) {
        progress = raw / 0.15 * 8;
    } else if (raw < 0.4) {
        const t = (raw - 0.15) / 0.25;
        progress = 8 + t * 19;
    } else if (raw < 0.68) {
        const t = (raw - 0.4) / 0.28;
        progress = 27 + t * 27;
    } else if (raw < 0.88) {
        const t = (raw - 0.68) / 0.20;
        progress = 54 + t * 29;
    } else {
        const t = (raw - 0.88) / 0.12;
        progress = 83 + t * 16;
    }

    progress = Math.min(progress, 99);

    progressBar.style.width = progress + "%";
    progressText.textContent = Math.floor(progress) + "%";

    if (raw >= 1) {
        finishLoader();
        return;
    }

    requestAnimationFrame(animateLoader);
}

function finishLoader() {

    if (finished) {
        return;
    }

    finished = true;

    progressBar.style.width = "100%";
    progressText.textContent = "100%";
    loadingDots.textContent = "...";

    setTimeout(() => {
        loader.classList.add("fade");

        setTimeout(() => {
            loader.style.display = "none";
        }, 650);

    }, 300);
}

let dotState = 0;

setInterval(() => {

    if (finished) {
        return;
    }

    dotState++;

    if (dotState > 3) {
        dotState = 1;
    }

    loadingDots.textContent = ".".repeat(dotState);

}, 400);

animateLoader();
</script>

</body>
</html>
