<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202124">
<title>Game Hub</title>
<link rel="icon" type="image/png" href="SPIRE.png">
<style>
:root{--bg:#202124;--bg-deep:#171819;--surface:#292b2e;--surface-2:#303236;--surface-3:#383a3e;--white:#f5f6f7;--soft:#c8cbd0;--muted:#8d9198;--line:rgba(255,255,255,.12);--line-strong:rgba(255,255,255,.23);--shadow:rgba(0,0,0,.28);--ease:cubic-bezier(.22,.8,.22,1);--spring:cubic-bezier(.16,1.12,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{min-height:100vh;overflow-x:hidden;color:var(--white);background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:24px 24px}body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.025),transparent 38%,rgba(0,0,0,.12))}button,input{font:inherit}a{color:inherit}button,a{-webkit-tap-highlight-color:transparent}
/* Transition layer */.page-transition{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;pointer-events:none;opacity:0;background:#111213;transform:translateY(100%);transition:transform .6s var(--ease),opacity .25s}.page-transition:before{content:"";width:56px;height:56px;border:1px solid rgba(255,255,255,.2);border-radius:18px;background:url("tung-nobg.png") center/contain no-repeat;filter:grayscale(1) brightness(1.4);transform:translateY(13px) scale(.8);transition:transform .5s var(--spring)}.page-transition.is-active{opacity:1;transform:translateY(0)}.page-transition.is-active:before{transform:translateY(0) scale(1) rotate(3deg)}.page-transition.is-leaving{transform:translateY(-100%);transition-duration:.7s}
/* Login */#passwordScreen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:22px;background:#1b1c1e;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px;transition:opacity .55s var(--ease),visibility .55s}#passwordScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}.passwordBox{width:min(100%,410px);padding:36px 30px 29px;text-align:center;background:rgba(42,44,47,.96);border:1px solid var(--line-strong);border-radius:24px;box-shadow:0 18px 45px var(--shadow);animation:panelIn .7s var(--spring) both;transition:opacity .4s,transform .45s var(--spring),filter .4s}.passwordBox.entering{opacity:0;transform:translateY(22px) scale(.94);filter:blur(4px)}.passwordBox.errorState{animation:quietShake .48s both;border-color:#fff}.passwordBox.cooldown{opacity:.7}.passwordBox img{display:block;width:112px;height:112px;object-fit:contain;margin:0 auto 17px;padding:7px;border:1px solid var(--line-strong);border-radius:50%;background:#35373a;filter:grayscale(1) brightness(1.18) drop-shadow(0 5px 9px rgba(0,0,0,.3));animation:mascotBreath 3.8s ease-in-out infinite}.passwordBox h2{font-size:28px;line-height:1;letter-spacing:-.8px;margin-bottom:10px}.passwordBox p{color:var(--soft);font-size:14px;line-height:1.5;margin-bottom:20px}.passwordBox input{width:100%;padding:13px 15px;margin-bottom:11px;border:1px solid var(--line-strong);border-radius:12px;outline:0;background:#f0f1f2;color:#151617;text-align:center;transition:border-color .2s,box-shadow .2s}.passwordBox input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
/* Buttons and icons */.passwordBox button,.navButton{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid var(--line-strong);font-weight:700;transition:background .2s,border-color .2s,box-shadow .2s,transform .18s var(--spring);will-change:transform}.passwordBox button{width:100%;padding:13px;border-radius:12px;background:#f2f3f4;color:#171819;box-shadow:0 5px 14px rgba(0,0,0,.22)}.passwordBox button:hover{background:#fff;border-color:#fff;box-shadow:0 7px 18px rgba(0,0,0,.28)}.passwordBox button:disabled{opacity:.45;cursor:not-allowed}.icon{width:17px;height:17px;display:block;flex:0 0 17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Shell */#website,#gamesPage{min-height:100vh;display:none;opacity:1;transform:none;transition:opacity .48s var(--ease),transform .48s var(--ease)}.pageHidden{opacity:0!important;transform:translateY(16px) scale(.99)!important;pointer-events:none}.siteHeader{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:76px;padding:11px clamp(18px,5vw,64px);background:rgba(32,33,36,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;min-width:0;text-decoration:none}.brand img{width:43px;height:43px;object-fit:contain;padding:3px;border:1px solid var(--line);border-radius:14px;background:#393b3f;filter:grayscale(1) brightness(1.25);box-shadow:0 4px 10px var(--shadow);animation:logoSettle 5s ease-in-out infinite}.brand strong{font-size:clamp(19px,3vw,27px);letter-spacing:-.7px;white-space:nowrap}.brand strong:after{content:".";color:var(--white)}.nav{display:flex;gap:8px}.navButton{min-width:82px;padding:10px 14px;border-radius:12px;background:var(--surface-2);color:var(--white);box-shadow:0 4px 11px var(--shadow)}.navButton:hover{background:var(--surface-3);border-color:var(--line-strong);box-shadow:0 7px 15px rgba(0,0,0,.34)}
/* Hero */.hero{position:relative;display:flex;align-items:center;justify-content:center;min-height:270px;padding:70px 20px 56px;text-align:center;overflow:hidden}.heroMascot{position:absolute;left:clamp(12px,13%,160px);top:35%;width:65px;height:65px;object-fit:contain;filter:grayscale(1) brightness(1.35) drop-shadow(0 4px 7px rgba(0,0,0,.35));opacity:.78;animation:mascotPeek 4.6s ease-in-out infinite}.hero h2{font-size:clamp(40px,7vw,70px);line-height:.95;letter-spacing:-3px;font-weight:750;text-shadow:0 4px 16px rgba(0,0,0,.2);animation:titleIn .7s var(--spring) both}.hero h2:after{content:"";display:block;width:62%;height:3px;margin:16px auto 0;border-radius:8px;background:var(--white);opacity:.55;transform:rotate(-1deg)}
/* Game tiles */.games{max-width:1280px;margin:auto;padding:25px clamp(18px,5vw,64px) 63px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.game{position:relative;min-height:171px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 20px var(--shadow);will-change:transform;transform-origin:center;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s;animation:cardIn .58s var(--spring) both}.game:nth-child(3n+2){background:#2d3033}.game:nth-child(3n){background:#33363a}.game:hover{background:#3a3d41;border-color:var(--line-strong);box-shadow:0 12px 26px rgba(0,0,0,.34)}.gameLink{display:block;height:100%;text-decoration:none}.game img{display:block;width:100%;height:151px;object-fit:cover;border:1px solid rgba(0,0,0,.65);border-radius:12px;background:#e4e5e6;box-shadow:0 3px 8px rgba(0,0,0,.24);transition:transform .3s var(--spring),filter .3s;filter:saturate(.75)}.game:hover img{transform:scale(1.02);filter:grayscale(.12) saturate(.85) brightness(1.05)}.game img[style*="hidden"]{display:none}footer{padding:24px 25px 38px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.2px}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}@keyframes titleIn{from{opacity:0;transform:translateY(15px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}@keyframes quietShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@keyframes mascotBreath{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}@keyframes mascotPeek{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(3deg)}}@keyframes logoSettle{0%,92%,100%{transform:rotate(0)}95%{transform:rotate(-4deg)}}
@media(max-width:700px){.siteHeader{padding:10px 15px}.brand img{width:38px;height:38px}.brand strong{font-size:19px}.navButton{min-width:0;padding:8px 11px;font-size:13px}.hero{min-height:220px;padding-top:57px}.heroMascot{width:50px;height:50px;left:7%}.games{grid-template-columns:1fr;padding-top:22px}.game{min-height:183px}.game img{height:163px}.passwordBox{padding:31px 23px 26px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}.game,.navButton,.passwordBox button{transform:none!important}.page-transition{display:none}}

/* Final dark mode: flat black surfaces, no texture, clearer motion. */
:root{--bg:#111214;--bg-deep:#090a0b;--surface:#1a1c1f;--surface-2:#202226;--surface-3:#292c30;--white:#f4f5f6;--soft:#b7bac0;--muted:#777c84;--line:rgba(255,255,255,.12);--line-strong:rgba(255,255,255,.25);--shadow:rgba(0,0,0,.55)}
body{background:#111214!important;background-image:none!important}
body:after{background:linear-gradient(130deg,rgba(255,255,255,.018),transparent 35%,rgba(0,0,0,.28))}
#passwordScreen{background:#0d0e10!important;background-image:none!important}
.passwordBox{background:#191b1e;border-color:rgba(255,255,255,.22);color:var(--white);box-shadow:0 22px 55px rgba(0,0,0,.62);animation:panelIn .8s var(--spring) both}
.passwordBox img{background:#24272b;border-color:rgba(255,255,255,.18);filter:grayscale(1) brightness(1.3) drop-shadow(0 7px 12px rgba(0,0,0,.5))}
.passwordBox p{color:var(--soft)}.passwordBox input{background:#f0f1f2;border-color:rgba(255,255,255,.22)}
.passwordBox button{background:#f4f5f6;color:#121315;box-shadow:0 7px 18px rgba(0,0,0,.4);animation:buttonIdle 3.6s ease-in-out infinite}.passwordBox button:hover{background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.siteHeader{background:rgba(17,18,20,.92);border-bottom-color:rgba(255,255,255,.13);box-shadow:0 5px 18px rgba(0,0,0,.3)}
.brand img{background:#292c30;filter:grayscale(1) brightness(1.35);box-shadow:0 5px 12px rgba(0,0,0,.45)}
.navButton{background:#202226;border-color:rgba(255,255,255,.17);box-shadow:0 5px 14px rgba(0,0,0,.42);animation:navBreath 4.5s ease-in-out infinite}.navButton:hover{background:#2b2e33;border-color:rgba(255,255,255,.4);box-shadow:0 10px 22px rgba(0,0,0,.55)}
.hero{min-height:285px}.heroMascot{filter:grayscale(1) brightness(1.45) drop-shadow(0 7px 12px rgba(0,0,0,.5));animation:mascotOrbit 5.2s ease-in-out infinite}.hero h2{text-shadow:0 7px 22px rgba(0,0,0,.65);animation:titleIn .9s var(--spring) both}.hero h2:after{background:#f4f5f6;opacity:.75;animation:lineGrow .8s .2s var(--spring) both}
.game{background:#191b1e;border-color:rgba(255,255,255,.13);box-shadow:0 9px 22px rgba(0,0,0,.48);animation:cardIn .7s var(--spring) both}.game:nth-child(3n+2){background:#1c1f22}.game:nth-child(3n){background:#202326}.game:hover{background:#292c30;border-color:rgba(255,255,255,.34);box-shadow:0 15px 30px rgba(0,0,0,.62);animation:tileHover .35s var(--spring) both}.game img{background:#d9dade;box-shadow:0 4px 10px rgba(0,0,0,.42);filter:grayscale(.65)}.game:hover img{filter:grayscale(.15) brightness(1.08);transform:scale(1.028)}
footer{color:#72767d}
.page-transition{background:#08090a}.page-transition:before{filter:grayscale(1) brightness(1.65) drop-shadow(0 7px 12px rgba(0,0,0,.6));animation:transitionBob 1.2s ease-in-out infinite}
@keyframes buttonIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes navBreath{0%,100%{box-shadow:0 5px 14px rgba(0,0,0,.42)}50%{box-shadow:0 8px 19px rgba(0,0,0,.5)}}
@keyframes mascotOrbit{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes lineGrow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:.75}}
@keyframes tileHover{from{filter:brightness(.96)}to{filter:brightness(1.04)}}
@keyframes transitionBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.04)}}
@media(prefers-reduced-motion:reduce){.navButton,.passwordBox button{animation:none!important}}


/* Game Hub: dark Minecraft-inspired block world theme. */
:root{--bg:#101311;--bg-deep:#080a09;--surface:#171c19;--surface-2:#202722;--surface-3:#29332a;--white:#e7eee5;--soft:#a9b7a6;--muted:#708070;--line:rgba(205,231,204,.14);--line-strong:rgba(205,231,204,.3);--shadow:rgba(0,0,0,.68);--grass:#6d9f48;--grass-light:#93bd65;--dirt:#795637;--stone:#626b67;--redstone:#a3483d}
body{background:var(--bg)!important;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px)!important;background-size:32px 32px!important;font-family:Verdana,Arial,sans-serif}
body:after{background:linear-gradient(135deg,rgba(95,143,67,.045),transparent 38%,rgba(0,0,0,.38))}
#passwordScreen{background:var(--bg-deep)!important;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px)!important;background-size:32px 32px!important}
.passwordBox{background:var(--surface);border:2px solid #080a09;border-radius:3px;box-shadow:7px 8px 0 #080a09;color:var(--white)}
.passwordBox img{background:var(--surface-3);border:2px solid #080a09;border-radius:3px;filter:grayscale(1) brightness(1.2) drop-shadow(4px 4px 0 #080a09)}
.passwordBox h2{font-family:Verdana,Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;text-shadow:2px 2px 0 #080a09}.passwordBox p{color:var(--soft)}
.passwordBox input{background:#dfe9dc;border:2px solid #080a09;border-radius:2px;color:#111;padding:12px}.passwordBox input:focus{border-color:var(--grass-light);box-shadow:0 0 0 3px rgba(147,189,101,.18)}
.passwordBox button{background:var(--grass);color:#101510;border:2px solid #080a09;border-radius:2px;box-shadow:4px 5px 0 #080a09;text-transform:uppercase;letter-spacing:1px}.passwordBox button:hover{background:var(--grass-light);box-shadow:5px 6px 0 #080a09}
.siteHeader{background:rgba(16,19,17,.94);border-bottom:2px solid #080a09;box-shadow:0 5px 0 rgba(0,0,0,.28);backdrop-filter:blur(10px)}
.brand img{background:var(--grass);border:2px solid #080a09;border-radius:2px;filter:grayscale(.25) brightness(1.15);box-shadow:3px 3px 0 #080a09}.brand strong{font-family:Verdana,Arial,sans-serif;text-transform:uppercase;letter-spacing:1px}.brand strong:after{color:var(--grass-light)}
.navButton{background:var(--surface-2);border:2px solid #080a09;border-radius:2px;box-shadow:3px 4px 0 #080a09;text-transform:uppercase;font-size:13px;letter-spacing:.6px}.navButton:hover{background:var(--surface-3);border-color:var(--grass-light);box-shadow:4px 5px 0 #080a09}
.icon{stroke-width:2.2}
.hero{min-height:285px;background:linear-gradient(180deg,rgba(109,159,72,.08),transparent 70%)}
.heroMascot{display:none}.hero h2{font-family:Verdana,Arial,sans-serif;text-transform:uppercase;letter-spacing:2px;text-shadow:4px 4px 0 #080a09;color:var(--white)}.hero h2:after{background:var(--grass);height:7px;border-radius:0;box-shadow:3px 3px 0 #080a09}
.games{gap:22px}.game{background:var(--surface);border:2px solid #080a09;border-radius:2px;box-shadow:5px 6px 0 #080a09;transition:background .2s,border-color .2s,box-shadow .2s}.game:nth-child(3n+2){background:#1b211c}.game:nth-child(3n){background:#202920}.game:hover{background:#29352a;border-color:var(--grass-light);box-shadow:7px 8px 0 #080a09}.game img{border:2px solid #080a09;border-radius:1px;box-shadow:3px 3px 0 #080a09;filter:saturate(.55) brightness(.86)}.game:hover img{filter:saturate(.8) brightness(1.02);transform:scale(1.018)}
footer{color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.page-transition{background:#080a09;border-radius:0}.page-transition:before{width:58px;height:58px;border:2px solid var(--grass-light);border-radius:2px;background:var(--grass);filter:none;box-shadow:5px 5px 0 #000}
@keyframes blockPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.passwordBox button,.navButton{animation:blockPulse 3.5s ease-in-out infinite}.game{animation:cardIn .55s var(--spring) both}
@media(max-width:700px){.brand strong{font-size:17px;letter-spacing:.7px}.hero h2{font-size:clamp(31px,9vw,52px);letter-spacing:1px}}

</style>
</head>
<body>
<div class="page-transition" id="pageTransition" aria-hidden="true"></div>
<div id="passwordScreen"><div class="passwordBox" id="passwordBox"><img src="tung-nobg.png" alt="Game Hub mascot"><h2>Welcome to Game Hub</h2><p>Enter the password to start playing.</p><input id="passwordInput" type="password" placeholder="Password" autocomplete="off" aria-label="Password"><button id="passwordButton" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>Enter</button></div></div>
<div id="website"><header class="siteHeader"><a class="brand" href="#" id="brandHome" aria-label="Game Hub home"><img src="tung-nobg.png" alt=""><strong>Game Hub</strong></a><nav class="nav"><a class="navButton" href="#" id="homeButton"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a class="navButton" href="#" id="gamesButton"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Games</a></nav></header><main><section class="hero"><img class="heroMascot" src="tung-nobg.png" alt=""><h2>Choose your world.</h2></section><section class="games" id="gameList" aria-label="Popular games"></section></main><footer>© 2026 Game Hub</footer></div>
<div id="gamesPage"><header class="siteHeader"><a class="brand" href="#" id="brandGames" aria-label="Game Hub home"><img src="tung-nobg.png" alt=""><strong>Game Hub</strong></a><nav class="nav"><a class="navButton" href="#" id="homeButton2"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg>Home</a><a class="navButton" href="#" id="gamesButton2"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Games</a></nav></header><main><section class="hero"><img class="heroMascot" src="tung-nobg.png" alt=""><h2>Select a world.</h2></section><section class="games" id="allGameList" aria-label="All games"></section></main><footer>© 2026 Game Hub</footer></div>
<script>
const GAME_COUNT=100,HOME_GAME_COUNT=8;let passwordLocked=false,transitionBusy=false;
function getTodayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function getPopularity(){const today=getTodayKey();let saved;try{saved=JSON.parse(localStorage.getItem("tungGamePopularity")||"null")}catch(e){saved=null}if(!saved||saved.date!==today){saved={date:today,visits:{}};localStorage.setItem("tungGamePopularity",JSON.stringify(saved))}return saved}
function recordVisit(number){const data=getPopularity();data.visits[number]=(data.visits[number]||0)+1;localStorage.setItem("tungGamePopularity",JSON.stringify(data))}
function getPopularGames(){const data=getPopularity();return Array.from({length:GAME_COUNT},(_,i)=>i+1).sort((a,b)=>(data.visits[b]||0)-(data.visits[a]||0)||a-b)}
function findImage(number,img){const extensions=["png","jpg","jpeg","webp"];let index=0;function next(){if(index>=extensions.length){img.style.visibility="hidden";return}const test=new Image(),extension=extensions[index++];test.onload=()=>{img.src=number+"."+extension};test.onerror=next;test.src=number+"."+extension}next()}
function gameCard(number){const card=document.createElement("div");card.className="game";card.style.animationDelay=Math.min(number%8,7)*35+"ms";const link=document.createElement("a");link.className="gameLink";link.href="loader.html?game="+encodeURIComponent(number);link.addEventListener("click",()=>recordVisit(number));const img=document.createElement("img");img.alt="Game "+number;findImage(number,img);link.appendChild(img);card.appendChild(link);return card}
function addCursorFollow(elements,strengthX,strengthY,rotation){elements.forEach(element=>{let x=0,y=0,targetX=0,targetY=0,vx=0,vy=0;element.addEventListener("pointermove",event=>{if(event.pointerType==="touch")return;const rect=element.getBoundingClientRect();targetX=((event.clientX-rect.left-rect.width/2)/(rect.width/2))*strengthX;targetY=((event.clientY-rect.top-rect.height/2)/(rect.height/2))*strengthY});element.addEventListener("pointerleave",()=>{targetX=0;targetY=0});function animate(){vx+=(targetX-x)*.16;vy+=(targetY-y)*.16;vx*=.72;vy*=.72;x+=vx;y+=vy;element.style.transform="translate3d("+x.toFixed(2)+"px,"+y.toFixed(2)+"px,0) rotate("+((vx-vy)*rotation).toFixed(2)+"deg)";requestAnimationFrame(animate)}animate()})}
function renderHomeGames(){const list=document.getElementById("gameList");list.innerHTML="";getPopularGames().slice(0,HOME_GAME_COUNT).forEach(number=>list.appendChild(gameCard(number)));addCursorFollow(list.querySelectorAll(".game"),12,9,.45)}function renderAllGames(){const list=document.getElementById("allGameList");list.innerHTML="";for(let i=1;i<=GAME_COUNT;i++)list.appendChild(gameCard(i));addCursorFollow(list.querySelectorAll(".game"),12,9,.45)}
function addButtonMotion(){addCursorFollow(document.querySelectorAll(".navButton"),24,16,1.1);addCursorFollow([document.getElementById("passwordButton")],16,10,.75)}
function switchPage(from,to,direction="forward"){if(transitionBusy)return;transitionBusy=true;const veil=document.getElementById("pageTransition"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;veil.style.transform=direction==="back"?"translateY(-100%)":"translateY(100%)";from.classList.add("pageHidden");setTimeout(()=>{veil.classList.add("is-active");setTimeout(()=>{from.style.display="none";to.style.display="block";to.classList.add("pageHidden");window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});requestAnimationFrame(()=>requestAnimationFrame(()=>{to.classList.remove("pageHidden");to.querySelectorAll(".game").forEach((card,i)=>{card.style.opacity="0";card.style.transform="translateY(14px)";setTimeout(()=>{card.style.opacity="";card.style.transform=""},i*25)});setTimeout(()=>veil.classList.add("is-leaving"),reduce?0:180);setTimeout(()=>veil.classList.remove("is-active","is-leaving"),reduce?30:700)}))},reduce?15:280)},reduce?0:150);setTimeout(()=>{transitionBusy=false},reduce?80:1050)}
const website=document.getElementById("website"),gamesPage=document.getElementById("gamesPage");function showHome(){if(transitionBusy||website.style.display==="block")return;renderHomeGames();switchPage(gamesPage,website,"back")}function showGames(){if(transitionBusy||gamesPage.style.display==="block")return;renderAllGames();switchPage(website,gamesPage,"forward")}function bind(id,handler){document.getElementById(id).addEventListener("click",event=>{event.preventDefault();handler()})}bind("homeButton",showHome);bind("gamesButton",showGames);bind("homeButton2",showHome);bind("gamesButton2",showGames);bind("brandHome",showHome);bind("brandGames",showHome);
function checkPassword(){if(passwordLocked)return;const input=document.getElementById("passwordInput"),box=document.getElementById("passwordBox"),button=document.getElementById("passwordButton");if(input.value==="TUNG"){box.classList.add("entering");setTimeout(()=>{document.getElementById("passwordScreen").classList.add("hidden");setTimeout(()=>{document.getElementById("passwordScreen").style.display="none";website.style.display="block";renderHomeGames();addButtonMotion()},550)},100)}else{passwordLocked=true;button.disabled=true;input.disabled=true;box.classList.remove("errorState");void box.offsetWidth;box.classList.add("errorState","cooldown");setTimeout(()=>{box.classList.remove("errorState","cooldown");input.disabled=false;button.disabled=false;input.value="";input.focus();passwordLocked=false},1300)}}
document.getElementById("passwordButton").addEventListener("click",checkPassword);document.getElementById("passwordInput").addEventListener("keydown",event=>{if(event.key==="Enter")checkPassword()});addCursorFollow([document.getElementById("passwordBox")],4,3,.3);
</script>
</body>
